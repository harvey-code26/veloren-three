name: Validate
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
jobs:
  test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm run build
      - name: Install Chromium for model smoke test
        run: npx playwright install --with-deps chromium
      - name: Render original character in headless Chromium
        run: timeout 110s npm run smoke:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: veloren-three-browser-screenshots
          path: artifacts/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: veloren-three-build
          path: dist/
